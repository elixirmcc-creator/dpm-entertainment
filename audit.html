
<!DOCTYPE html>
<html>
<head>
    <title>Gallery Audit</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .item { border: 1px solid #333; padding: 10px; text-align: center; }
        img { width: 100%; height: auto; border-radius: 4px; }
        span { display: block; margin-top: 10px; font-size: 12px; color: #gold; }
    </style>
</head>
<body>
    <div class="grid" id="audit-grid"></div>
    <script>
        const grid = document.getElementById('audit-grid');
        for (let i = 1; i <= 33; i++) {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <img src="images/gallery/g${i}.jpg" alt="g${i}">
                <span>g${i}.jpg</span>
            `;
            grid.appendChild(item);
        }
    </script>
</body>
</html>
